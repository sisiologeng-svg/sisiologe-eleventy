---
layout: base.html
---

<article style="max-width:750px; margin:0 auto; padding:3rem 1.5rem;">
  
  <div style="margin-bottom:2rem;">
    <a href="/blog/" style="color:var(--olive); font-size:0.85rem; letter-spacing:1px; text-transform:uppercase;">
      ← Back to Blog
    </a>
  </div>

  {% if image %}
  <img src="{{ image }}" alt="{{ title }}"
    style="width:100%; height:400px; object-fit:cover; border-radius:2px; margin-bottom:2rem;">
  {% endif %}

  <p style="font-size:0.75rem; letter-spacing:3px; text-transform:uppercase; color:var(--olive); margin-bottom:1rem;">
    {{ date | date: "%B %d, %Y" }}
  </p>

  <h1 style="font-family:'Cormorant Garamond',serif; font-size:clamp(2rem,5vw,3.5rem); color:var(--text-primary); margin-bottom:2rem; line-height:1.2;">
    {{ title }}
  </h1>

  <div style="font-size:1rem; line-height:2; color:var(--text-secondary);">
    {{ content }}
  </div>

  <div style="margin-top:4rem; padding-top:2rem; border-top:1px solid var(--border); text-align:center;">
    <p style="color:var(--text-muted); margin-bottom:1rem;">Enjoyed this? Share it with a sisí! 🩵</p>
    <a href="/blog/" class="btn btn-outline">← More Stories</a>
  </div>

</article>
