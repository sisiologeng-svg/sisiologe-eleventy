---
layout: base.html
---

<article>

  <div style="max-width:750px; margin:0 auto; padding:2rem 1.5rem 0;">
    <a href="/blog/" style="color:var(--olive); font-size:0.78rem; letter-spacing:2px; text-transform:uppercase;">
      ← Back to Blog
    </a>
  </div>

  {% if image %}
  <div style="max-width:900px; margin:2rem auto 0; padding:0 1.5rem;">
    <img src="{{ image }}" alt="{{ title }}"
      style="width:100%; height:450px; object-fit:cover; border-radius:2px;">
  </div>
  {% endif %}

  <div style="max-width:680px; margin:0 auto; padding:2.5rem 1.5rem 1rem; text-align:center;">
    <p style="font-size:0.72rem; letter-spacing:3px; text-transform:uppercase; color:var(--olive); margin-bottom:1.2rem;">
      {{ date | date: "%B %d, %Y" }}
    </p>

    <h1 style="font-family:'Cormorant Garamond',serif; font-weight:600; font-size:clamp(2.2rem,6vw,3.8rem); color:var(--text-primary); margin-bottom:0; line-height:1.15;">
      {{ title }}
    </h1>
  </div>

  <div class="blog-content" style="max-width:680px; margin:2.5rem auto 0; padding:0 1.5rem;">
    {{ content }}
  </div>

  <div style="max-width:680px; margin:4rem auto 0; padding:2rem 1.5rem 4rem; border-top:1px solid var(--border); text-align:center;">
    <p style="color:var(--text-muted); margin-bottom:1.2rem; font-size:0.9rem;">Enjoyed this? Share it with a sisí! 🩵</p>
    <a href="/blog/" class="btn btn-outline">← More Stories</a>
  </div>

</article>
