backend:
  name: git-gateway
  branch: main

media_folder: "images/products"
public_folder: "/images/products"

collections:
  - name: "products"
    label: "🛍️ Products"
    folder: "src/products"
    create: true
    identifier_field: name
    slug: "{{slug}}"
    fields:
      - {label: "Product Name", name: "name", widget: "string"}
      - {label: "Price (₦)", name: "price", widget: "number"}
      - {label: "Category", name: "category", widget: "select", options: ["bags", "caps", "accessories", "sole", "rtw"]}
      - {label: "Main Image", name: "image", widget: "image"}
      - {label: "Image 2", name: "image2", widget: "image", required: false}
      - {label: "Image 3", name: "image3", widget: "image", required: false}
      - {label: "Image 4", name: "image4", widget: "image", required: false}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Available", name: "available", widget: "boolean", default: true}
      - {label: "Featured on Homepage", name: "featured", widget: "boolean", default: false}
      - {label: "Badge", name: "badge", widget: "select", options: ["new", "sale", ""], default: "new"}

  - name: "orders"
    label: "📦 Orders"
    folder: "src/orders"
    create: false
    slug: "{{slug}}"
    fields:
      - {label: "Customer Name", name: "customer_name", widget: "string"}
      - {label: "Phone", name: "phone", widget: "string"}
      - {label: "Email", name: "email", widget: "string"}
      - {label: "Items", name: "items", widget: "string"}
      - {label: "Total (₦)", name: "total", widget: "string"}
      - {label: "Delivery Method", name: "delivery_method", widget: "string"}
      - {label: "Delivery Day", name: "delivery_day", widget: "string"}
      - {label: "Address", name: "address", widget: "string", required: false}
      - {label: "Landmark", name: "landmark", widget: "string", required: false}
      - {label: "Order Notes", name: "notes", widget: "text", required: false}
      - {label: "Promo Code", name: "promo", widget: "string", required: false}
      - {label: "Date", name: "date", widget: "datetime"}

  - name: "reviews"
    label: "⭐ Reviews"
    folder: "src/reviews"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Reviewer Name", name: "reviewer", widget: "string"}
      - {label: "Screenshot", name: "image", widget: "image"}
      - {label: "Active", name: "active", widget: "boolean", default: true}

  - name: "promos"
    label: "🏷️ Promo Codes"
    folder: "src/promos"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Code", name: "code", widget: "string"}
      - {label: "Discount %", name: "discount", widget: "number"}
      - {label: "Active", name: "active", widget: "boolean", default: true}
      - {label: "Description", name: "description", widget: "string"}

  - name: "blog"
    label: "📝 Blog"
    folder: "src/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Subtitle", name: "subtitle", widget: "string", required: false}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Cover Image", name: "image", widget: "image", required: false}
      - {label: "Extra Image 1 (optional, in-post)", name: "image2", widget: "image", required: false}
      - {label: "Extra Image 2 (optional, in-post)", name: "image3", widget: "image", required: false}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "settings"
    label: "⚙️ Site Settings"
    files:
      - label: "Announcement Bar"
        name: "announcement"
        file: "src/_data/announcement.json"
        fields:
          - {label: "Message", name: "message", widget: "string"}
          - {label: "Active", name: "active", widget: "boolean", default: true}